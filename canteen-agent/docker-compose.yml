version: "3.8"

services:
  # ===== MySQL 8.0 =====
  # 建表与种子数据由 backend 侧负责：backend 启动时会 create_all，
  # 首次部署再执行一次 `docker compose exec backend python init_db.py` 灌种子数据。
  mysql:
    image: mysql:8.0
    container_name: canteen-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - canteen-net

  # ===== Redis 7 =====
  redis:
    image: redis:7-alpine
    container_name: canteen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - canteen-net

  # ===== Milvus 2.4 (Standalone) =====
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: canteen-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - canteen-net

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: canteen-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - canteen-net

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: canteen-milvus
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - canteen-net

  # ===== Backend (FastAPI + APScheduler 定时任务) =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: canteen-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AGENT_INTERNAL_URL: ${AGENT_INTERNAL_URL}
      BACKEND_SECRET_KEY: ${BACKEND_SECRET_KEY}
      # 自动同步间隔（分钟），0 = 关闭自动同步，只保留手动 POST /api/v1/sync
      AUTO_SYNC_INTERVAL_MINUTES: ${AUTO_SYNC_INTERVAL_MINUTES:-5}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - canteen-net

  # ===== Agent 分析消费者（Redis Stream 消费组，多开即并发） =====
  # 消费评论分片 → Supervisor-Worker 深度加工 → 回调 backend 写库
  agent-consumer:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: canteen-agent-consumer
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      MILVUS_HOST: ${MILVUS_HOST}
      MILVUS_PORT: ${MILVUS_PORT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL}
      OPENAI_EMBED_API_KEY: ${OPENAI_EMBED_API_KEY}
      OPENAI_EMBED_BASE_URL: ${OPENAI_EMBED_BASE_URL}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      CONSUMER_CONCURRENCY: ${CONSUMER_CONCURRENCY:-4}
    volumes:
      - ./agent:/app
    command: python -m app.consumer --consumer c1
    networks:
      - canteen-net

  # ===== Agent (LangGraph 微服务) =====
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: canteen-agent
    restart: unless-stopped
    depends_on:
      milvus:
        condition: service_healthy
    environment:
      MILVUS_HOST: ${MILVUS_HOST}
      MILVUS_PORT: ${MILVUS_PORT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL}
      OPENAI_EMBED_API_KEY: ${OPENAI_EMBED_API_KEY}
      OPENAI_EMBED_BASE_URL: ${OPENAI_EMBED_BASE_URL}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL}
      AGENT_CONFIDENCE_THRESHOLD: ${AGENT_CONFIDENCE_THRESHOLD}
      AGENT_RAG_TOP_K: ${AGENT_RAG_TOP_K}
      AGENT_RAG_SIMILARITY_THRESHOLD: ${AGENT_RAG_SIMILARITY_THRESHOLD}
    ports:
      - "8001:8001"
    volumes:
      - ./agent:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    networks:
      - canteen-net

  # ===== Frontend (Vue 3) =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: canteen-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - agent
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000
    networks:
      - canteen-net

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:

networks:
  canteen-net:
    driver: bridge
